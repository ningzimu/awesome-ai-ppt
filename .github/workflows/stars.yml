name: Update stars

on:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: update-stars
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update star cache
        run: python3 scripts/update_stars.py
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Render READMEs
        run: python3 scripts/render_readme.py

      - name: Validate threshold and bilingual sync
        run: python3 scripts/check_bilingual.py

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update GitHub stars cache"
          file_pattern: docs/stars.json README.md README_EN.md

      # A push made with GITHUB_TOKEN does not trigger the Pages push workflow.
      - name: Trigger Pages deployment
        if: github.ref == 'refs/heads/main'
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          GH_TOKEN: ${{ github.token }}
