name: Links

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read
  issues: write

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress --exclude-path .lycheeignore README.md CONTRIBUTING.md docs/index.html
          fail: false
          format: markdown
          jobSummary: true
          output: ./lychee/out.md

      - name: Create issue on scheduled failure
        if: steps.lychee.outputs.exit_code != 0 && github.event_name == 'schedule'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Link check failed
          content-filepath: ./lychee/out.md
          labels: maintenance

      - name: Fail on broken links
        if: steps.lychee.outputs.exit_code != 0
        run: exit 1
