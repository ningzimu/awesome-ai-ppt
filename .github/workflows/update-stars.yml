name: Update Stars

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-stars:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refresh GitHub stars
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_stars.py

      - name: Validate project data
        run: |
          python3 -m json.tool docs/projects.json > /tmp/projects.json
          node --check docs/projects-data.js
          node --check docs/stars-data.js

      - name: Check bilingual content
        run: python3 scripts/check_bilingual.py

      - name: Commit star updates
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update GitHub star counts"
          file_pattern: README.md README_EN.md docs/projects.json docs/projects-data.js docs/stars-data.js

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
