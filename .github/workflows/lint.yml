name: Lint

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check whitespace
        run: git diff --check HEAD

      - name: Validate project data
        run: python3 -m json.tool docs/projects.json > /tmp/projects.json

      - name: Check generated READMEs
        run: |
          python3 scripts/render_readme.py
          git diff --exit-code README.md README_EN.md

      - name: Check generated Pages data
        run: |
          python3 scripts/render_pages_data.py
          git diff --exit-code docs/projects-data.js

      - name: Check bilingual content
        run: python3 scripts/check_bilingual.py
