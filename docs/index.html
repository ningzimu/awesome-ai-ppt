<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="AI PPT、PowerPoint 自动化、PPTX 编辑和幻灯片工作流工具的双语可搜索目录。">
    <title>Awesome AI PPT</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="site-header">
      <nav class="topbar" aria-label="Primary">
        <a class="brand" href="./" aria-label="Awesome AI PPT home">
          <span class="brand-mark">AI</span>
          <span>Awesome AI PPT</span>
        </a>
        <div class="top-actions">
          <a class="star-nav-link" href="https://github.com/ningzimu/awesome-ai-ppt" aria-label="Star Awesome AI PPT on GitHub">
            <span class="github-icon" aria-hidden="true"></span>
            <span class="star-icon" aria-hidden="true">★</span>
            <span id="repoStars">Star</span>
          </a>
          <div class="language-switch" aria-label="Language switch">
            <button class="active" type="button" data-lang="zh">中文</button>
            <button type="button" data-lang="en">English</button>
          </div>
        </div>
      </nav>
      <section class="hero">
        <div class="hero-main">
          <h1 data-i18n="heroTitle">按技术路线和工作流查找 AI PPT 项目</h1>
          <p class="hero-copy" data-i18n="heroCopy">
            搜索 AI 演示生成、PowerPoint 自动化、PPTX 编辑、可编辑重建和幻灯片 agent 工作流开源工具。
          </p>
          <div class="hero-actions">
            <a class="primary-action" href="#projectList" data-i18n="browseLabel">浏览项目</a>
            <a class="secondary-action" href="agent/" data-i18n="agentCta">安装 Agent Skill</a>
          </div>
        </div>
        <div class="hero-panel" aria-label="Directory summary">
          <div class="hero-panel-head">
            <span data-i18n="summaryLabel">目录概览</span>
          </div>
          <div class="hero-stats">
            <div>
              <strong id="statProjects">0</strong>
              <span data-i18n="projectsLabel">项目</span>
            </div>
            <div>
              <strong id="statCategories">0</strong>
              <span data-i18n="categoriesLabel">分类</span>
            </div>
            <div>
              <strong>10+</strong>
              <span data-i18n="thresholdLabel">入选门槛</span>
            </div>
          </div>
        </div>
      </section>
    </header>

    <main class="layout">
      <section class="content">
        <nav id="categoryNav" class="category-nav" aria-label="Category navigation"></nav>

        <div class="toolbar" aria-label="Directory controls">
          <label class="search">
            <span data-i18n="searchLabel">搜索</span>
            <input id="searchInput" type="search" placeholder="搜索名称、分类、输出类型、英文描述..." autocomplete="off">
          </label>
          <label class="select">
            <span data-i18n="tagsLabel">标签</span>
            <select id="tagSelect">
              <option value="" data-i18n="allTags">全部标签</option>
            </select>
          </label>
          <label class="select">
            <span data-i18n="sortLabel">排序</span>
            <select id="sortSelect">
              <option value="stars-desc" data-i18n="sortStarsDesc">Star 降序</option>
              <option value="stars-asc" data-i18n="sortStarsAsc">Star 升序</option>
              <option value="name-asc" data-i18n="sortNameAsc">名称 A-Z</option>
            </select>
          </label>
        </div>

        <div class="result-line">
          <span id="resultCount">0 个项目</span>
          <span id="activeCategory">全部分类</span>
        </div>

        <div id="projectList" class="project-list" aria-live="polite"></div>
      </section>
    </main>

    <footer class="site-footer">
      <span><a href="https://github.com/ningzimu/awesome-ai-ppt/blob/main/LICENSE">CC0 1.0 Universal</a> @2026 <a href="https://github.com/ningzimu">ningzimu</a></span>
    </footer>

    <script src="stars-data.js" defer></script>
    <script src="projects-data.js" defer></script>
    <script src="app.js" defer></script>
  </body>
</html>
